# The github-actions block updates the pinned actions. This repository holds
# finished work kept as a record and carries no package manifest, so it keeps
# that block alone.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
