#
# Requirements-to-test traceability of the diagnostic path of the retrofitted
# anti-skid test-diagnosis module. verification/README.md is the data
# dictionary; traceability.schema.json is the schema; tools/check_traceability.py
# checks this file against both and regenerates traceability.csv from it.
#
# Reconstructed in 2026 from Chapter 5 of the research report; formal
# traceability matrices were not produced during the project (report, Section
# 4.5). Diagnostic path only. Not a certification artefact.

schema_version: 1
title: Requirements-to-test traceability of the diagnostic path
record_status: >-
  Reconstructed in 2026 from report Chapter 5; formal matrices were not
  produced during the project (report Section 4.5); diagnostic path only;
  not a certification artefact.
applies_to: Research report, revised edition of October 2026 (report/)
as_of: "2026-10-05"
scope: >-
  The diagnostic path: the SPI link from the FPGA logger through the
  optocouplers to the STM32 diagnostics board, and the logging of the frames
  on the SD card and over USB. The fault handling of the safety-related core
  is not covered here; report Tables 4.1, 5.2 and 5.3 describe it.
requirement_source: >-
  No requirement list exists for the module (report Section 4.5). Each
  requirement below restates the design intent that the report describes, at
  the place it names; none is a requirement of a specification.

requirements:
  - id: REQ-DP-01
    statement: >-
      The FPGA logger of 2023 sends diagnostic frames of 32 bits to the STM32
      diagnostics board: a 2-bit event-type prefix (error change or button
      change), the six button states and the 24-bit error vector.
    source:
      label: sec:fpga_core_details
      locator: Section 3.2, SPI Master Interface
    tests:
      - id: L1-DP-01
        layer: 1
        method: not-tested
        item: Logging function of the FPGA design of 2023
        date: null
        status: NOT-DOCUMENTED
        defect: null
        evidence:
          - source: report
            label: sec:fpga_core_details
            locator: Section 3.2
            kind: report-text
            archived: true
            public: true
          - source: leyer2023
            locator: Section 3.3
            kind: project-report
            archived: true
            public: false
        note: >-
          The logging function was implemented on the FPGA side and not
          tested, and the STM32 had no code yet to interpret the frames.

  - id: REQ-DP-02
    statement: >-
      The logger of the follow-on project of 2025 sends the 24-bit error
      vector to the STM32 diagnostics board as three bytes.
    source:
      label: sec:fpga_core_details
      locator: Section 3.2, SPI Master Interface
    tests:
      - id: L1-DP-02
        layer: 1
        method: simulation
        item: Logger of the follow-on project (2025)
        date: "2025-08"
        status: OPEN
        defect: B5
        evidence:
          - source: report
            label: sec:diagnostic_resolution
            locator: Section 5.3
            kind: report-text
            archived: true
            public: true
          - source: report
            label: tab:bug_taxonomy
            locator: Table 5.4, row B5
            kind: report-text
            archived: true
            public: true
          - source: savchuk2025
            locator: p. 21
            kind: project-report
            archived: true
            public: false
        note: >-
          In the simulation, the first two bytes of each frame were transferred
          correctly and the third byte was corrupted; the transmitter had not
          been tested on the hardware. Whether it was changed afterwards is not
          documented, nor which logger the FPGA design of the rebuilt unit
          contains.

  - id: REQ-DP-03
    statement: >-
      Error codes reach the STM32 diagnostics board over the galvanically
      isolated SPI link.
    source:
      label: sec:stm32_details
      locator: Section 3.3, Galvanically Isolated SPI Slave
    tests:
      - id: L1-DP-03
        layer: 1
        method: link-test
        item: Rev 0.0 prototype, test design with 8-bit test codes
        date: "2023"
        status: OBSERVED
        defect: null
        evidence:
          - source: report
            label: sec:stm32_details
            locator: Section 3.3
            kind: report-text
            archived: true
            public: true
          - source: leyer2023
            locator: Section 4.11
            kind: project-report
            archived: true
            public: false
        note: >-
          Error codes were transferred over the isolated link with reused test
          programs and checked in the log file; the logging function of the
          final design was not part of this test. The report names no archived
          log of it.

  - id: REQ-DP-04
    statement: >-
      The STM32 firmware receives each 32-bit frame completely.
    source:
      label: sec:diagnostic_resolution
      locator: Section 5.3, SPI Payload Truncation and Alignment (B5)
    tests:
      - id: L2-DP-04
        layer: 2
        method: operation
        item: Rebuilt unit after the fix of the firmware of 2023
        date: early 2026
        status: FIX-APPLIED-NOT-VERIFIED
        defect: B5
        evidence:
          - source: report
            label: tab:bug_taxonomy
            locator: Table 5.4, row B5
            kind: report-text
            archived: true
            public: true
          - source: report
            label: sec:diagnostic_resolution
            locator: Section 5.3
            kind: report-text
            archived: true
            public: true
          - source: report
            label: tab:evidence_state
            locator: Table 5.3
            kind: report-text
            archived: true
            public: true
        note: >-
          Receiver: fix applied; transmitter: change not documented; diagnostic
          path not verified separately. The firmware of 2023 received 16 of the
          32 bits; the fix sizes the reception to four bytes. The rebuilt unit
          was observed operating as a whole in early 2026; no log or capture of
          that run was archived. What the fix did about the inverted SPI lines
          and the slave select is not documented.

  - id: REQ-DP-05
    statement: >-
      The STM32 firmware writes the received frames to the SD card without
      losing frames.
    source:
      label: sec:diagnostic_resolution
      locator: Section 5.3, SD Card Storage (B4)
    tests:
      - id: L2-DP-05
        layer: 2
        method: operation
        item: Diagnostics board with the firmware of the follow-on project (2025)
        date: "2025"
        status: OPEN
        defect: B4
        evidence:
          - source: report
            label: sec:diagnostic_resolution
            locator: Section 5.3
            kind: report-text
            archived: true
            public: true
          - source: savchuk2025
            locator: pp. 16 to 19 and 22
            kind: project-report
            archived: true
            public: false
        note: >-
          The SD-card logging froze; the cause is not established, and no fix
          of this firmware is documented.
      - id: L2-DP-06
        layer: 2
        method: operation
        item: Rebuilt unit after the fix of the firmware of 2023
        date: early 2026
        status: FIX-APPLIED-NOT-VERIFIED
        defect: B4
        evidence:
          - source: report
            label: tab:bug_taxonomy
            locator: Table 5.4, row B4
            kind: report-text
            archived: true
            public: true
          - source: report
            label: sec:diagnostic_resolution
            locator: Section 5.3
            kind: report-text
            archived: true
            public: true
          - source: report
            label: tab:evidence_state
            locator: Table 5.3
            kind: report-text
            archived: true
            public: true
        note: >-
          Fix applied (firmware of 2023); diagnostic path not verified
          separately; freeze with the firmware of 2025: no fix documented. The
          firmware of 2023 mounted and unmounted the file system around every
          write, so that frames were overrun; the fix mounts the card once and
          reduces the logging frequency. The rebuilt unit was observed
          operating as a whole in early 2026; no log or capture of that run was
          archived.

  - id: REQ-DP-06
    statement: >-
      The log files on the SD card can be retrieved over USB without removing
      the card.
    source:
      label: sec:stm32_details
      locator: Section 3.3, USB Interface
    tests:
      - id: L2-DP-07
        layer: 2
        method: operation
        item: Rebuilt unit
        date: null
        status: NOT-DOCUMENTED
        defect: null
        evidence:
          - source: report
            label: sec:stm32_details
            locator: Section 3.3
            kind: report-text
            archived: true
            public: true
        note: >-
          The report documents no result of this function on the rebuilt unit.

  - id: REQ-DP-07
    statement: >-
      Faults on the isolated side of the diagnostics board do not feed back
      into the FPGA domain through the signal path.
    source:
      label: sec:stm32_details
      locator: Section 3.3, Galvanically Isolated SPI Slave and Isolated Power Supply
    tests:
      - id: L1-DP-08
        layer: 1
        method: not-tested
        item: Rebuilt unit
        date: null
        status: NOT-DOCUMENTED
        defect: null
        evidence:
          - source: report
            label: sec:stm32_details
            locator: Section 3.3
            kind: report-text
            archived: true
            public: true
          - source: report
            label: sec:diagnostic_resolution
            locator: Section 5.3, last paragraph
            kind: report-text
            archived: true
            public: true
        note: >-
          The isolation is provided by design and has not been tested. The parts
          of the diagnostics board on the Base Board side of the barrier, the
          suppressor diode, the input of the isolated converter and the
          optocoupler LEDs, remain a fault path into the Base Board.

  - id: REQ-DP-08
    statement: >-
      The SPI signals cross the optocouplers within the timing of the SPI
      clock of about 96.8 kHz.
    source:
      label: eq:spi_clock
      locator: Section 3.3, Equation 3.2
    tests:
      - id: L1-DP-09
        layer: 1
        method: oscilloscope
        item: Diagnostics board of the rebuilt unit
        date: "2025"
        status: OBSERVED
        defect: null
        evidence:
          - source: report
            label: sec:stm32_details
            locator: Section 3.3
            kind: report-text
            archived: true
            public: true
          - source: savchuk2025
            locator: p. 22
            kind: project-report
            archived: true
            public: false
        note: >-
          The follow-on project reports that an oscilloscope check of the
          diagnostics board showed no unstable communication; no capture is
          archived. On the datasheet's typical curve, the turn-off time at the
          fitted 10 kOhm pull-ups is many times the half-period, so the link
          has no timing margin on these figures; the timing across the barrier
          has not been verified.
